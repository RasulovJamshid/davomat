name: atlas

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: Asia/Tashkent
    volumes:
      - atlas_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://brandfaces.uz,https://www.brandfaces.uz}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEED: ${RUN_SEED:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@brandfaces.uz}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe123!}
      BOOTSTRAP_COMPANY_NAME: ${BOOTSTRAP_COMPANY_NAME:-Brandfaces}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://brandfaces.uz}
      EMAIL_FROM: ${EMAIL_FROM:-Davomat <no-reply@brandfaces.uz>}
      SMTP_URL: ${SMTP_URL:-}
      TZ: Asia/Tashkent
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PUBLIC_PORT:-4000}:4000"
    networks: [backend]

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.brandfaces.uz/api}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PUBLIC_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [backend]

volumes:
  atlas_db:

networks:
  backend:
    driver: bridge
